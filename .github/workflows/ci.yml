name: A5VM CI

on:
  push:
  pull_request:

jobs:
  portable-core:
    name: Portable core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build demo
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -I include \
            src/memory.c src/cpu8086.c src/cpu386.c src/vga_text.c src/keyboard.c \
            src/floppy.c src/disk.c src/ide.c src/bios.c src/bios386.c src/pic8259.c src/pit8253.c src/machine.c src/main.c \
            -o build/a5vm-demo

      - name: Build tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I include \
            src/memory.c src/cpu8086.c src/cpu386.c src/vga_text.c src/keyboard.c \
            src/floppy.c src/disk.c src/ide.c src/bios.c src/bios386.c src/pic8259.c src/pit8253.c src/machine.c tests/test_a5vm.c \
            -o build/a5vm-tests

      - name: Run tests
        run: ./build/a5vm-tests

      - name: Run demo
        run: ./build/a5vm-demo

      - name: Upload portable core artifact
        uses: actions/upload-artifact@v4
        with:
          name: a5vm-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/a5vm-demo
            build/a5vm-tests
          if-no-files-found: error

  ios-armv7:
    name: iOS 6 ARMv7 tool
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install ldid

      - name: Download iPhoneOS 6.1 SDK
        run: |
          SDK_BASE="https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS6.1.sdk"
          for part in 001 002 003; do
            curl -L --fail --retry 3 \
              "$SDK_BASE/iPhoneOS6.1.sdk.zip.$part" \
              -o "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip.$part"
          done
          cat "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip."* > "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip"
          mkdir -p "$RUNNER_TEMP/iphone-sdk"
          unzip -q "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip" -d "$RUNNER_TEMP/iphone-sdk"
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/update-theos"
          mkdir -p "$THEOS/sdks"
          SDK=$(find "$RUNNER_TEMP/iphone-sdk" -type d -name iPhoneOS6.1.sdk -print -quit)
          test -n "$SDK"
          cp -R "$SDK" "$THEOS/sdks/iPhoneOS6.1.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build iOS 6 GUI app
        run: |
          make -f Makefile.ios THEOS="$THEOS" clean all
          app=$(find .theos -type d -name A5VM.app -print -quit)
          test -n "$app"
          mkdir -p build/ios6-gui
          cp -R "$app" build/ios6-gui/A5VM.app
          cp app/Info.plist build/ios6-gui/A5VM.app/Info.plist
          rm -rf build/ios6-gui/A5VM.app/A5VM.dSYM
          ldid -S build/ios6-gui/A5VM.app/A5VM
          /usr/bin/zip -qry build/a5vm-ios6-gui.zip build/ios6-gui/A5VM.app
          file build/ios6-gui/A5VM.app/A5VM

      - name: Upload iOS 6 GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: a5vm-ios6-gui-${{ github.sha }}
          path: build/a5vm-ios6-gui.zip
          if-no-files-found: error

  qemu-native-smoke:
    name: UTM QEMU i386 smoke build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and QEMU fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libpixman-1-dev ninja-build

      - name: Build QEMU i386 system emulator
        working-directory: third_party/qemu
        run: |
          ./configure \
            --target-list=i386-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-curses \
            --disable-vnc \
            --disable-spice \
            --disable-opengl \
            --disable-virtfs \
            --disable-slirp \
            --disable-fdt \
            --disable-capstone \
            --disable-tools
          make -C i386-softmmu -j2 qemu-system-i386

      - name: Run QEMU smoke check
        working-directory: third_party/qemu
        run: |
          ./i386-softmmu/qemu-system-i386 --version

      - name: Upload QEMU smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: a5vm-qemu-i386-${{ github.sha }}
          path: third_party/qemu/i386-softmmu/qemu-system-i386
          if-no-files-found: error
