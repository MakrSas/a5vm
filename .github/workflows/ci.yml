name: A5VM CI

on:
  push:
  pull_request:

jobs:
  portable-core:
    name: Portable core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build demo
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -I include \
            src/memory.c src/cpu8086.c src/main.c \
            -o build/a5vm-demo

      - name: Build tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I include \
            src/memory.c src/cpu8086.c tests/test_a5vm.c \
            -o build/a5vm-tests

      - name: Run tests
        run: ./build/a5vm-tests

      - name: Run demo
        run: ./build/a5vm-demo

      - name: Upload portable core artifact
        uses: actions/upload-artifact@v4
        with:
          name: a5vm-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/a5vm-demo
            build/a5vm-tests
          if-no-files-found: error

  ios-armv7:
    name: iOS 6 ARMv7 tool
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install ldid xz

      - name: Install Theos and iPhoneOS SDK
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/update-theos"
          mkdir -p "$THEOS/sdks"
          curl -L --fail --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS9.3.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS9.3.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS9.3.sdk.tar.xz" -C "$THEOS/sdks"

      - name: Build ARMv7 iOS tool
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          mkdir -p build/ios-armv7
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          clang -target armv7-apple-ios6.0 -isysroot "$SDK" \
            -miphoneos-version-min=6.0 -fno-stack-protector -ffreestanding \
            -Iinclude -c src/memory.c src/cpu8086.c src/freestanding.c \
            src/ios_main.c src/ios_start.c
          clang -target armv7-apple-ios6.0 -isysroot "$SDK" \
            -miphoneos-version-min=6.0 -nostdlib -Wl,-e,_start \
            memory.o cpu8086.o freestanding.o ios_main.o ios_start.o \
            -o build/ios-armv7/a5vm
          ldid -S build/ios-armv7/a5vm
          file build/ios-armv7/a5vm

      - name: Upload iOS ARMv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: a5vm-ios6-armv7-${{ github.sha }}
          path: build/ios-armv7/a5vm
          if-no-files-found: error
