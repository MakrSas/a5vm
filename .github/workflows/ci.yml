name: A5VM CI

on:
  push:
  pull_request:

jobs:
  portable-core:
    name: Portable core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build demo
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -I include \
            src/memory.c src/cpu8086.c src/main.c \
            -o build/a5vm-demo

      - name: Build tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I include \
            src/memory.c src/cpu8086.c tests/test_a5vm.c \
            -o build/a5vm-tests

      - name: Run tests
        run: ./build/a5vm-tests

      - name: Run demo
        run: ./build/a5vm-demo

      - name: Upload portable core artifact
        uses: actions/upload-artifact@v4
        with:
          name: a5vm-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/a5vm-demo
            build/a5vm-tests
          if-no-files-found: error

  ios-armv7:
    name: iOS 6 ARMv7 tool
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install ldid

      - name: Download iPhoneOS 6.1 SDK
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/Sn0wCooder/theos-sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS6.1.sdk
          cat "$RUNNER_TEMP/theos-sdks/iPhoneOS6.1.sdk/iPhoneOS6.1.sdk.zip."* \
            > "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip"
          mkdir -p "$RUNNER_TEMP/iphone-sdk"
          unzip -q "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip" -d "$RUNNER_TEMP/iphone-sdk"

      - name: Build ARMv7 iOS tool
        run: |
          mkdir -p build/ios-armv7
          SDK=$(find "$RUNNER_TEMP/iphone-sdk" -type d -name iPhoneOS6.1.sdk -print -quit)
          test -n "$SDK"
          clang -target armv7-apple-ios6.0 -isysroot "$SDK" \
            -miphoneos-version-min=6.0 -Iinclude \
            -c src/memory.c src/cpu8086.c src/main.c
          clang -target armv7-apple-ios6.0 -isysroot "$SDK" \
            -miphoneos-version-min=6.0 \
            memory.o cpu8086.o main.o \
            -o build/ios-armv7/a5vm
          ldid -S build/ios-armv7/a5vm
          file build/ios-armv7/a5vm

      - name: Upload iOS ARMv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: a5vm-ios6-armv7-${{ github.sha }}
          path: build/ios-armv7/a5vm
          if-no-files-found: error
